# PromptStreak production stack.
#
# Brings up:
#   - postgres : the application database.
#   - web      : the Next.js app (apps/web), reachable only via the caddy proxy.
#   - caddy    : public TLS termination + a loopback-only admin vhost.
#
# Usage on the VPS:
#   cp deploy/.env.example .env       # edit secrets
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
# Operators reach the admin surface from their laptop with an SSH tunnel:
#   ssh -L 8443:127.0.0.1:8081 user@vps
# then open https://localhost:8443/admin (accept the local cert).
#
# See docs/admin-ops-runbook.md for the full procedure.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promptstreak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-promptstreak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports - postgres is reached over the internal compose network only.
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-promptstreak}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-promptstreak}
      ADMIN_INTERNAL_PROXY_SECRET: ${ADMIN_INTERNAL_PROXY_SECRET:?set ADMIN_INTERNAL_PROXY_SECRET}
      ADMIN_FINGERPRINT_SALT: ${ADMIN_FINGERPRINT_SALT:?set ADMIN_FINGERPRINT_SALT}
      ADMIN_TOTP_KEYS: ${ADMIN_TOTP_KEYS:?set ADMIN_TOTP_KEYS}
      ADMIN_TOTP_ACTIVE_KEY: ${ADMIN_TOTP_ACTIVE_KEY:?set ADMIN_TOTP_ACTIVE_KEY}
      GITHUB_TOKEN_ENCRYPTION_KEYS: ${GITHUB_TOKEN_ENCRYPTION_KEYS:?set GITHUB_TOKEN_ENCRYPTION_KEYS}
      GITHUB_TOKEN_ENCRYPTION_ACTIVE_KEY: ${GITHUB_TOKEN_ENCRYPTION_ACTIVE_KEY:?set GITHUB_TOKEN_ENCRYPTION_ACTIVE_KEY}
      NODE_ENV: production
    # No published ports - reached only by caddy on the internal compose network.
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      # Admin vhost bound to LOOPBACK ONLY on the host. Reachable from the VPS
      # itself (or via SSH tunnel from a laptop), never from the public internet.
      - "127.0.0.1:8081:8081"
    environment:
      ADMIN_INTERNAL_PROXY_SECRET: ${ADMIN_INTERNAL_PROXY_SECRET}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  # Automated, encrypted Postgres backups. See docs/ops/backups.md for the full
  # rotation policy and recovery procedure. The image is built from
  # deploy/postgres-backup.Dockerfile, which extends the upstream
  # prodrigestivill/postgres-backup-local image with `age` for at-rest
  # encryption using an offline-escrowed recovery key.
  postgres-backup:
    build:
      context: .
      dockerfile: postgres-backup.Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-promptstreak}
      POSTGRES_USER: ${POSTGRES_USER:-promptstreak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Daily at 02:30 UTC. Same cron format as the upstream image.
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      # Recipients file is mounted read-only below. The hook script
      # (deploy/postgres-backup-encrypt.sh) reads it and encrypts every dump
      # in place. Unset/empty disables encryption (dev only).
      AGE_RECIPIENTS_FILE: /run/secrets/age_recipients
      HEALTHCHECK_PORT: 8080
    volumes:
      - pgbackups:/backups
      # The recipients file holds one or more age public keys (one per line),
      # e.g. `age1abc...`. Plaintext, not secret — but pinning via a bind mount
      # makes accidental edits visible in code review.
      - ./age-recipients.txt:/run/secrets/age_recipients:ro
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  pgbackups:

networks:
  internal:
    driver: bridge
